name: Run Sitemap Extractor

on:
  workflow_dispatch: # Adds the "Run" button in the Actions tab
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run script
        # Because your file has no extension, we call it directly by its name
        run: python main
