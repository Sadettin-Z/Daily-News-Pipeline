name: Run News Extractor

on:
  workflow_dispatch:
  # Optional: also run on a schedule (every 6 hours)
  # schedule:
  #   - cron: '0 */6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests curl_cffi trafilatura beautifulsoup4 lxml newspaper3k googlenewsdecoder

      - name: Run script
        run: python test_transkript.py
