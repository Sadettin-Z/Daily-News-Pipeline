name: Run Sitemap Extractor

on:
  workflow_dispatch: # Adds the "Run" button to your Actions tab
  schedule:
    - cron: '0 0 * * *' # Runs automatically every 24 hours (at midnight UTC)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run script
        # This matches your file name 'main.py'
        run: python main.py
